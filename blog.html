    <style>
        /* ===== BRUTALIST AVANT-GARDE / KR-NEON-VOID ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Pretendard', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            background: #0b0b0e;
            color: #e8e6e3;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ===== NEON VOID COLOR SYSTEM ===== */
        :root {
            --neon-cyan: #00f5d4;
            --neon-magenta: #f20089;
            --neon-yellow: #fcee0a;
            --neon-orange: #ff6b35;
            --brutal-bg: #0b0b0e;
            --brutal-surface: #16161a;
            --brutal-border: #2a2a30;
            --brutal-text: #e8e6e3;
            --brutal-muted: #9c9a9f;
            --shadow-neon-cyan: 0 0 12px rgba(0, 245, 212, 0.5);
            --shadow-neon-magenta: 0 0 12px rgba(242, 0, 137, 0.5);
        }
        /* ===== TYPOGRAPHY ===== */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.3);
        }
        h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); line-height: 1.1; }
        h2 { font-size: clamp(1.8rem, 4.5vw, 2.8rem); border-left: 6px solid var(--neon-magenta); padding-left: 0.8rem; margin: 2rem 0 1.2rem; }
        h3 { font-size: clamp(1.3rem, 3vw, 2rem); margin: 1.6rem 0 0.8rem; }
        p { margin-bottom: 1rem; font-size: 1.05rem; }
        a { color: var(--neon-cyan); text-decoration: underline wavy var(--neon-magenta) 2px; text-underline-offset: 4px; transition: all 0.2s; }
        a:hover { color: var(--neon-yellow); text-decoration-color: var(--neon-yellow); }
        strong { color: var(--neon-yellow); }
        em { color: var(--neon-magenta); font-style: normal; text-shadow: 0 0 4px var(--neon-magenta); }
        blockquote {
            border-left: 6px solid var(--neon-orange);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: rgba(255, 107, 53, 0.08);
            font-style: italic;
            color: var(--brutal-muted);
        }
        /* ===== LAYOUT ===== */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        /* ===== HEADER / NAV ===== */
        .site-header {
            position: sticky; top: 0; z-index: 999;
            background: rgba(11, 11, 14, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--brutal-border);
            padding: 0.6rem 0;
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;
        }
        .logo {
            font-size: 1.8rem; font-weight: 900; text-transform: uppercase;
            color: var(--neon-cyan); text-shadow: 0 0 12px rgba(0, 245, 212, 0.6);
            text-decoration: none; letter-spacing: -0.04em;
        }
        .logo span { color: var(--neon-magenta); }
        .logo:hover { text-decoration: none; }
        /* ===== HAMBURGER MENU (Pattern: hamburger-menu) ===== */
        .nav-checkbox { display: none; }
        .nav-toggle {
            display: none; flex-direction: column; gap: 5px; cursor: pointer;
            padding: 8px; background: transparent; border: none; z-index: 1001;
        }
        .nav-toggle span {
            display: block; width: 28px; height: 3px;
            background: var(--neon-cyan); border-radius: 2px;
            transition: all 0.3s ease;
        }
        .nav-checkbox:checked + .nav-toggle span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .nav-checkbox:checked + .nav-toggle span:nth-child(2) { opacity: 0; }
        .nav-checkbox:checked + .nav-toggle span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }
        .nav-menu {
            display: flex; gap: 1.2rem; list-style: none; align-items: center;
        }
        .nav-menu a {
            color: var(--brutal-text); text-decoration: none; font-weight: 600;
            font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em;
            padding: 0.4rem 0.6rem; border: 2px solid transparent; transition: all 0.2s;
        }
        .nav-menu a:hover, .nav-menu a:focus { border-color: var(--neon-magenta); color: var(--neon-cyan); text-decoration: none; }
        .nav-menu .active { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        @media (max-width: 768px) {
            .nav-toggle { display: flex; }
            .nav-menu {
                position: fixed; top: 0; right: -100%; width: 70%; height: 100vh;
                background: var(--brutal-surface); flex-direction: column;
                justify-content: center; gap: 2rem; padding: 2rem;
                border-left: 3px solid var(--neon-magenta);
                transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
                box-shadow: -8px 0 30px rgba(0,0,0,0.7);
            }
            .nav-checkbox:checked ~ .nav-menu { right: 0; }
            .nav-menu a { font-size: 1.2rem; }
        }
        /* ===== HERO (blog intro) ===== */
        .blog-hero {
            padding: 4rem 0 2rem;
            text-align: center;
            border-bottom: 2px solid var(--brutal-border);
            margin-bottom: 2.5rem;
        }
        .blog-hero h1 {
            font-size: clamp(2.5rem, 7vw, 4.2rem);
        }
        .blog-hero p {
            max-width: 700px; margin: 1rem auto 0;
            color: var(--brutal-muted); font-size: 1.15rem;
        }
        /* ===== ARTICLE ===== */
        .blog-article {
            max-width: 780px;
            margin: 0 auto 4rem;
            padding: 0 1rem;
        }
        .blog-article .meta {
            display: flex; gap: 1.5rem; flex-wrap: wrap;
            color: var(--brutal-muted); font-size: 0.9rem;
            border-bottom: 1px dashed var(--brutal-border);
            padding-bottom: 0.8rem; margin-bottom: 2rem;
        }
        .blog-article .meta span { display: flex; align-items: center; gap: 0.3rem; }
        .blog-article img {
            max-width: 100%; height: auto;
            border: 3px solid var(--brutal-border);
            margin: 1.8rem 0;
            filter: grayscale(0.3) contrast(1.1);
        }
        .blog-article ul, .blog-article ol {
            padding-left: 1.8rem; margin-bottom: 1.2rem;
        }
        .blog-article li { margin-bottom: 0.5rem; }
        .blog-article .highlight-box {
            background: rgba(242, 0, 137, 0.08);
            border: 2px solid var(--neon-magenta);
            padding: 1.5rem; border-radius: 4px;
            margin: 2rem 0;
        }
        .blog-article .highlight-box p:last-child { margin-bottom: 0; }
        .blog-article .cta-inline {
            display: inline-block; margin-top: 1rem;
            background: var(--neon-magenta); color: #fff;
            padding: 0.6rem 1.8rem; font-weight: 800;
            text-transform: uppercase; text-decoration: none;
            border: 2px solid var(--neon-cyan);
            transition: all 0.2s;
        }
        .blog-article .cta-inline:hover {
            background: var(--neon-cyan); color: #000;
            border-color: var(--neon-magenta);
            text-decoration: none;
        }
        /* ===== FOOTER ===== */
        .site-footer {
            margin-top: auto;
            border-top: 2px solid var(--brutal-border);
            padding: 2rem 0;
            text-align: center;
            color: var(--brutal-muted);
            font-size: 0.9rem;
        }
        .site-footer a { color: var(--brutal-muted); text-decoration: underline; }
        .site-footer a:hover { color: var(--neon-cyan); }
        /* ===== RESPONSIVE 768 (패턴) ===== */
        @media (max-width: 768px) {
            .container { padding: 0 1rem; }
            .blog-hero { padding: 2.5rem 0 1.5rem; }
            .blog-article { padding: 0 0.5rem; }
            .blog-article .meta { flex-direction: column; gap: 0.4rem; }
            .highlight-box { padding: 1rem; }
        }
        /* 툴팁 및 기타 잡다 */
        .screen-reader-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    </style>
</head>
